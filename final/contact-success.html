<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=Barlow:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="icon" href="images/favicon.svg">
  <link rel="stylesheet" href="styles/style.css">
  <title>Message Received - Beyond Earth</title>
  <meta name="author" content="Fred">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <header><nav aria-label="Main navigation"><a href="index.html" class="nav-brand">Beyond <span>Earth</span></a><button id="hamburger" class="hamburger" aria-controls="nav-links" aria-expanded="false">☰</button><ul id="nav-links" class="nav-links" role="list"><li><a href="index.html">Home</a></li><li><a href="history.html">History</a></li><li><a href="contact.html">Contact</a></li></ul></nav></header>
  <main id="main-content" style="padding:4rem 0"><div class="container" style="text-align:center;max-width:680px;margin:0 auto"><h1 style="font-family:'Orbitron',sans-serif;font-size:2rem;color:var(--heading);margin-bottom:1rem">Message Received</h1><p style="font-size:1rem;color:var(--muted);margin-bottom:2rem">Thank you for reaching out.</p><div id="submission-data" style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:2rem;margin-bottom:2rem;text-align:left;display:grid;grid-template-columns:1fr 1fr;gap:1rem"></div><a href="contact.html" class="btn btn-outline">Back</a><a href="index.html" class="btn btn-primary">Home</a></div></main>
  <footer><div class="container"><div class="footer-bottom"><span>&copy; <span id="year"></span> Beyond Earth</span></div></div></footer>
  <script>document.getElementById('year').textContent=new Date().getFullYear();const p=new URLSearchParams(window.location.search);['name','email','category','message'].forEach(k=>{const d=document.createElement('div');d.innerHTML=`<div style="font-family:'Share Tech Mono',monospace;font-size:0.7rem;color:var(--accent);margin-bottom:0.25rem">${k.toUpperCase()}</div><div style="font-size:0.95rem;color:var(--text)">${p.get(k)||'N/A'}</div>`;document.getElementById('submission-data').appendChild(d)});</script>
</body>
</html>
